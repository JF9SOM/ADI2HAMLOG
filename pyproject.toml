[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adi2hamlog"
version = "0.1.0"
description = "Convert ADIF (.adi) logs to Turbo HAMLOG CSV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
test = ["pytest"]

[project.scripts]
adi2hamlog = "adi2hamlog.cli:main"

[project.gui-scripts]
adi2hamlog-gui = "adi2hamlog.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adi2hamlog = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
