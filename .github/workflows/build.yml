name: Build apps

# Manual run (Actions tab -> Run workflow) builds artifacts only.
# Pushing a tag like v0.1.0 also publishes them to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e ".[gui]" pyinstaller
      - run: python packaging/build.py --smoke
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg_src
          cp -R dist/adi2hamlog.app dmg_src/
          ln -s /Applications dmg_src/Applications
          hdiutil create -volname adi2hamlog -srcfolder dmg_src -ov -format UDZO adi2hamlog-${{ matrix.name }}.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/adi2hamlog -DestinationPath adi2hamlog-${{ matrix.name }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf adi2hamlog-${{ matrix.name }}.tar.gz adi2hamlog
      - uses: actions/upload-artifact@v4
        with:
          name: adi2hamlog-${{ matrix.name }}
          path: |
            adi2hamlog-${{ matrix.name }}.dmg
            adi2hamlog-${{ matrix.name }}.zip
            adi2hamlog-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
